name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Localizar o projeto (zip na raiz ou código solto)
        run: |
          Z=$(ls SpotFlow*.zip 2>/dev/null | head -n1)
          if [ -z "$Z" ]; then Z=$(ls *.zip 2>/dev/null | head -n1); fi
          if [ -n "$Z" ]; then
            echo "Usando o zip: $Z"
            mkdir -p _proj
            unzip -q -o "$Z" -d _proj
            D=$(find _proj -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n1)
            if [ -z "$D" ]; then echo "ERRO: settings.gradle.kts não encontrado dentro do zip"; exit 1; fi
          else
            D=.
          fi
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$D/app/build.gradle.kts" | head -n1)
          echo "PROJ_DIR=$D" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VER:-0}" >> "$GITHUB_ENV"
          echo "Projeto: $D | versão: ${VER:-0}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Salvar o log de erro (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Renomear o APK
        run: |
          mkdir -p out
          cp "$PROJ_DIR/app/build/outputs/apk/debug/app-debug.apk" "out/SpotFlow-${APP_VERSION}.apk"

      - name: Guardar o APK (aba Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SpotFlow-${{ env.APP_VERSION }}-apk
          path: out/SpotFlow-*.apk

      - name: Publicar em Releases (link direto para baixar no celular)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${APP_VERSION}-build${GITHUB_RUN_NUMBER}" "out/SpotFlow-${APP_VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "SpotFlow ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK com.luandevsgame.spotflow, versão ${APP_VERSION}."
